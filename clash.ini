;自用规则优化版 v4.3（自建节点版 / OpenClash）
;v4.2 → v4.3 改动清单:
;1. 修正分流顺序:大陆域名/公司IP/下载/China 列表提到 ProxyGFWlist 之前
;   (ACL4SSR 标准顺序:大陆域名 → GFW 列表 → GEOIP 兜底),
;   避免两者重合的域名被 GFW 列表抢先送去代理
;2. 美国节点正则:补 🇺🇸/🇺🇲、美东/美西;US 改成 \bUS\b,
;   避免 RUSSIA / AUS / Belarus 这类含 "us" 的节点被误判成美国
;3. 🌐 其他地区 的排除词与三个专属组逐字同步(含新增的国旗和 美东/美西),
;   否则新加的关键词会让节点从「其他地区」里凭空消失
;4. 🤖 AI / 💧 Copilot 默认改为 🇺🇲 美国节点:OpenAI/Copilot 对港日节点风控严,
;   默认走美国,不合适再手动切
;5. 🎵 TikTok 默认改为 🇯🇵 日本节点,并把美国提到「其他地区」之前
;6. 其余规则、分组、测速参数与 v4.2 完全一致
;
;兼容性提醒: []GEOSITE 规则需要 mihomo(Clash.Meta) 内核。
;如果换回 Clash Premium 内核,请把带 GEOSITE 的两行删掉,否则内核起不来。

