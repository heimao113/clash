[custom]
;自用规则优化版 v2
;本次优化说明:
;1.测速参数格式为: 测速链接`间隔秒[,超时秒,容差毫秒]
;   原来 300,,50 = 每300秒才测一轮(节点挂了最多要等5分钟才切换),
;   超时未设置(默认5秒,坏节点标记慢,面板出现4-5秒的延迟数字)
;   现改为: 间隔120秒 + 超时3秒 + 容差50ms,切换更快、延迟刷新更勤
;2.自动选择原来用 .* 匹配所有节点,"剩余流量/到期/官网"等假节点
;   也会被拉进测速,列表里一堆超时和异常延迟,现已排除这些假节点
;3.故障转移组没有容差概念(固定用列表中第一个存活节点),参数为 120,3
;4.修复 奈飞节点 组:原来正则里写"🇯🇵 日本节点/🇭🇰 香港节点"永远匹配
;   不到任何节点,机场没有NF命名节点时该组会是空的导致断流,已改为引用策略组
;5.美国节点/其他地区 补充假节点过滤(与港日组一致);未被引用的香港均衡已注释
;6.若 gstatic 测速地址不稳,可把下面所有 generate_204 地址替换为
;   http://cp.cloudflare.com/generate_204
;7.节点数量很多时嫌测速频繁,可把 120 改回 180

