; ================== 节点筛选策略组 ==================
custom_proxy_group=🐸 手动切换`select`.*
;假节点关键词统一排除(剩余流量/到期/官网等),自动选择测速列表不再被污染
custom_proxy_group=♻️ 自动选择`url-test`^((?!(剩余|到期|过期|套餐|流量|官网|订阅|重置|失联|频道|电报|公告)).)*$`http://www.gstatic.com/generate_204`120,3,50
custom_proxy_group=🇭🇰 香港节点`select`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))^((?!(深港|US|家宽|游戏|剩余|流量|到期|过期|套餐|官网|订阅|重置|失联|频道|电报|公告|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$
custom_proxy_group=🇯🇵 日本节点`select`(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))^((?!(家宽|游戏|剩余|流量|到期|过期|套餐|官网|订阅|重置|失联|频道|电报|公告|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$
custom_proxy_group=🇺🇲 美国节点`select`(?=.*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States))^((?!(家宽|游戏|剩余|流量|到期|过期|套餐|官网|订阅|重置|失联|频道|电报|公告|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$
;修复:原来正则里的"🇯🇵 日本节点|🇭🇰 香港节点"是匹配不到的写法,改为引用策略组
custom_proxy_group=🎥 奈飞节点`select`(NF|奈飞|解锁|Netflix|NETFLIX|Media)`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🔯 香港故转`[]🔯 日本故转`[]🚀 节点选择
custom_proxy_group=🌐 其他地区`select`^(?!.*(香港|HK|Hong Kong|🇭🇰|HongKong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美|US|United States|新加坡|坡|狮城|SG|Singapore|台湾|TW|Taiwan|剩余|到期|过期|套餐|官网|订阅|重置|失联|频道|电报|公告)).*
;故障转移参数:间隔120秒+超时3秒;fallback 固定用第一个存活节点,无需容差
custom_proxy_group=🔯 香港故转`fallback`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))^((?!(深港|家宽|游戏|剩余|流量|0.5|0.5倍|0.5x|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x|5.0|5倍|5x)).)*$`http://www.gstatic.com/generate_204`120,3
custom_proxy_group=🔯 日本故转`fallback`(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))^((?!(深港|家宽|游戏|剩余|流量|0.5|0.5倍|0.5x|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x|5.0|5倍|5x)).)*$`http://www.gstatic.com/generate_204`120,3
;香港均衡没有被任何规则/策略组引用,纯空耗,需要时取消注释
;custom_proxy_group=🍃 香港均衡`load-balance`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))^((?!(家宽|游戏|剩余|流量|0.5|0.5倍|0.5x|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x|5.0|5倍|5x)).)*$`http://www.gstatic.com/generate_204`120,3,50

