[custom]
;自用规则优化版 v3（自建节点版）
;自建节点没有"剩余流量/到期/倍率"这类杂项,已精简:
;1.测速间隔统一 180 秒(3分钟),超时 3 秒
;   url-test 格式: 测速链接`间隔[,超时秒,容差毫秒] → 180,3,50
;   fallback 格式: 180,3(固定用列表第一个存活节点,无容差概念)
;2.删除机场专用的关键词过滤(倍率/家宽/游戏/剩余流量等),地区组只按地区词匹配
;3.自动选择直接 .* 匹配全部节点
;4.奈飞节点组只引用策略组
;5.个别节点如果一直超时:多半是落地屏蔽Google,
;   把所有 generate_204 地址换成 http://cp.cloudflare.com/generate_204 即可

