; ================== 节点筛选策略组 ==================
custom_proxy_group=🐸 手动切换`select`.*
;3分钟一轮,超时3秒,容差50ms(避免延迟小幅波动来回切)
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`180,3,50
custom_proxy_group=🇭🇰 香港节点`select`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))
custom_proxy_group=🇯🇵 日本节点`select`(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))
custom_proxy_group=🇺🇲 美国节点`select`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)
;⚠️ 没有对应地区节点时请删除该组及其所有 []引用,空组会让内核起不来
;🌐 其他地区 = 兜底组:排除词和上面三个专属组的关键词一一对应,
;没被 香港/日本/美国 匹配到的节点(SG/TW/KR/UK/DE…)自动全归这里,加新地区节点不用改配置
custom_proxy_group=🌐 其他地区`select`^(?!.*(香港|HK|Hong Kong|🇭🇰|HongKong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)).*
custom_proxy_group=🎥 奈飞节点`select`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🌐 其他地区`[]🔯 香港故转`[]🔯 日本故转`[]🚀 节点选择`[]🐸 手动切换
;故障转移:3分钟一轮,超时3秒
custom_proxy_group=🔯 香港故转`fallback`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))`http://www.gstatic.com/generate_204`180,3
custom_proxy_group=🔯 日本故转`fallback`(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))`http://www.gstatic.com/generate_204`180,3
;香港均衡没有被引用,需要时取消注释
;custom_proxy_group=🍃 香港均衡`load-balance`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))`http://www.gstatic.com/generate_204`180,3,50

