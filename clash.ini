;自用规则优化版 v4.2（自建节点版 / OpenClash）
;v3 → v4.2 改动清单:
;1. Telegram 规则前移:紧跟自己的 4 条自定义规则之后,先于所有订阅规则命中
;   (IP-CIDR 段优先匹配,OpenClash 白名单模式下防止 TG 断连的老坑)
;2. ♻️ Speedtest 改名 📡 Speedtest(emoji 与 ♻️ 自动选择 撞名,面板里容易看混)
;3. 🌐 其他地区 改为真正的"兜底组":排除词 = 香港/日本/美国 三个组的关键词合集,
;   没被专属组匹配到的节点(SG/TW/KR/UK/DE…)全部自动落入其他地区,加节点不用改配置
;4. 所有带地区子选项的策略组(爱好/YouTube/AI/Copilot/微软/苹果/TG/FCM/游戏/国外媒体等)
;   统一补上 []🌐 其他地区 引用;直连类(国内媒体/全球直连)和广告拦截类组不加
;5. 新增 udp_flag=true(给所有节点统一开 UDP,TG 通话/游戏需要;自建 vless 无碍)
;其余规则、分组、测速参数与 v3 完全一致

